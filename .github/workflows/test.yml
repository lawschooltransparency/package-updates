name: Tests

on:
  pull_request:
  push:
    branches: [v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-lock-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test node/lock-diff.test.cjs
